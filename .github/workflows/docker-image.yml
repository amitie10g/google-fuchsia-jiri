name: Docker Image CI

on:
  workflow_dispatch:
  schedule: 
   - cron: '0 0 1 */3 *'

permissions:
  actions:  write
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build the Docker image
      run: docker buildx build --platform linux/amd64 -t ghcr.io/${{ github.repository_owner }}/google-fuchsia-jiri --push .
